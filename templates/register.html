<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký - Hệ thống hỗ trợ chẩn đoán Parkinson</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #f0f4f8; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-6xl mx-auto bg-white rounded-2xl shadow-2xl flex flex-col md:flex-row overflow-hidden">
        
        <div class="w-full md:w-1/2 bg-gradient-to-br from-blue-600 to-indigo-700 text-white p-8 md:p-12 flex flex-col justify-center">
            <div class="flex items-center justify-center space-x-4 mb-6">
                <img src="/static/images/logo-truong.png" alt="Logo Trường" class="h-16 w-auto">
                <img src="/static/images/logo-khoa.png" alt="Logo Khoa" class="h-16 w-auto">
            </div>
            <h1 class="text-3xl font-bold text-center mb-3">NGHIÊN CỨU XÂY DỰNG HỆ SINH THÁI GIÚP CHẨN ĐOÁN SỚM VÀ ĐIỀU TRỊ CHO NGƯỜI BỆNH PARKINSON</h1>
            
            <div class="mt-auto pt-8 border-t border-blue-500">
                <h3 class="font-semibold text-lg mb-2">Nhóm nghiên cứu và phát triển:</h3>
                <ul class="text-sm space-y-1 text-indigo-200">
                    <li><strong>GVHD:</strong> TS. Ngô Quang Vĩ</li>
                    <li><strong>Sinh viên:</strong> Đinh Mạnh Hoàng, Nguyễn Thị Quỳnh, Lê Trung Hiếu, Nguyễn Viết Hiệp</li>
                </ul>
            </div>
        </div>

        <div class="w-full md:w-1/2 p-8 md:p-12 flex items-center justify-center">
            <div class="w-full max-w-md">
                <h2 class="text-3xl font-bold text-center text-gray-800 mb-6">Tạo Tài Khoản</h2>
                <form id="registerForm">
                    <div class="mb-4">
                        <label for="fullName" class="block text-gray-700 text-sm font-bold mb-2">Họ và tên</label>
                        <input type="text" id="fullName" name="fullName" class="shadow-sm appearance-none border rounded-lg w-full py-3 px-4" required>
                    </div>
                    <div class="mb-4">
                        <label for="phone" class="block text-gray-700 text-sm font-bold mb-2">Số điện thoại</label>
                        <input type="tel" id="phone" name="phone" class="shadow-sm appearance-none border rounded-lg w-full py-3 px-4" required>
                    </div>
                     <div class="mb-4">
                        <label for="address" class="block text-gray-700 text-sm font-bold mb-2">Địa chỉ</label>
                        <input type="text" id="address" name="address" class="shadow-sm appearance-none border rounded-lg w-full py-3 px-4" required>
                    </div>
                    <div class="mb-6">
                        <label for="password" class="block text-gray-700 text-sm font-bold mb-2">Mật khẩu</label>
                        <input type="password" id="password" name="password" class="shadow-sm appearance-none border rounded-lg w-full py-3 px-4" required>
                    </div>
                    <div class="flex items-center justify-between">
                        <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded-lg focus:outline-none focus:shadow-outline transition-transform transform hover:scale-105">
                            Đăng Ký
                        </button>
                    </div>
                     <p class="text-center mt-6">
                        <a href="/login" class="inline-block align-baseline font-bold text-sm text-blue-500 hover:text-blue-800">
                            Đã có tài khoản? Đăng nhập
                        </a>
                    </p>
                </form>
                <p id="message" class="text-center mt-4 text-sm"></p>
            </div>
        </div>
        
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async function(event) {
            event.preventDefault();
            const phone = document.getElementById('phone').value;
            const fullName = document.getElementById('fullName').value;
            const address = document.getElementById('address').value;
            const password = document.getElementById('password').value;
            const message = document.getElementById('message');

            const response = await fetch('/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ phone, fullName, address, password })
            });

            const result = await response.json();
            
            message.textContent = result.message;
            if (result.success) {
                message.className = 'text-green-600 text-center mt-4 text-sm';
                setTimeout(() => {
                    window.location.href = '/login';
                }, 2000);
            } else {
                message.className = 'text-red-500 text-center mt-4 text-sm';
            }
        });
    </script>
</body>
</html>
